<!doctype html>
<!-- Source for assets/og/og-image.png: open at 1200 x 630 and take a screenshot. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Sharing image</title>
<style>
@font-face { font-family: "Bricolage Grotesque"; src: url("../assets/fonts/bricolage-grotesque-latin-wdth-var.woff2") format("woff2"); font-weight: 200 800; font-stretch: 75% 100%; }
@font-face { font-family: "IBM Plex Sans"; src: url("../assets/fonts/ibm-plex-sans-latin-var.woff2") format("woff2"); font-weight: 400 600; }
* { box-sizing: border-box; margin: 0; }
body { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #080809 radial-gradient(ellipse 70% 55% at 50% 0%, rgb(229 37 53 / .16), transparent 70%); color: #F5F3F3; font-family: "IBM Plex Sans", sans-serif; }
.word { position: absolute; top: -20px; left: 0; right: 0; display: flex; justify-content: center; color: #E52535; opacity: .5; font: 800 400px/1 "Bricolage Grotesque"; font-stretch: 75%; text-transform: uppercase; white-space: nowrap; -webkit-mask-image: linear-gradient(to bottom, #000 5%, transparent 72%); }
h1 { position: absolute; left: 64px; top: 84px; width: 1040px; font: 800 118px/.92 "Bricolage Grotesque"; font-stretch: 75%; text-transform: uppercase; }
p { position: absolute; left: 64px; bottom: 62px; font-size: 30px; font-weight: 500; line-height: 1.35; }
p span { color: #FF4D5B; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: #C21C2B; }
</style>
</head>
<body>
  <div class="word">Business</div>
  <h1>Your business deserves more than just a website.</h1>
  <p>Nikhil Modi<br><span>Independent Website &amp; Web Application Developer</span></p>
  <div class="bar"></div>
